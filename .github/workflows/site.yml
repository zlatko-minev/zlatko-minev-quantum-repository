# Size guard on every push / PR; build and deploy the website to GitHub Pages
# from main. One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Size guard
        run: python3 tools/check_sizes.py --top 10
      - name: Catalog is up to date
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python3 tools/build_catalog.py
          git diff --exit-code catalog.json || {
            echo "::error::catalog.json is stale — run python3 tools/build_catalog.py and commit"; exit 1; }
      - name: Every item has a thumbnail
        run: |
          python3 tools/make_thumbnails.py
          test -z "$(git status --porcelain site/thumbs)" || {
            git status --porcelain site/thumbs
            echo "::error::missing thumbnails — run python3 tools/make_thumbnails.py and commit"; exit 1; }
      - name: Build site
        run: python3 tools/build_site.py --with-pdfs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
